<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Cupones{% endblock %}</title>
  <style>
    :root { --texto:#1f2933; --suave:#616e7c; --linea:#d9dee3; --fondo:#f5f7f9;
            --acento:#0b5cad; --ok:#1b7a43; --ok-bg:#e6f4ea; --err:#b3261e; --err-bg:#fdecea; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: "Segoe UI", system-ui, sans-serif; color:var(--texto); background:var(--fondo); }
    nav { background:#fff; border-bottom:1px solid var(--linea); padding:.75rem 1.5rem; display:flex; gap:1.5rem; }
    nav a { color:var(--acento); text-decoration:none; font-weight:600; }
    nav a:hover { text-decoration:underline; }
    main { max-width:820px; margin:2rem auto; padding:0 1.5rem; }
    h1 { font-size:1.6rem; margin:0 0 1.25rem; }
    .panel { background:#fff; border:1px solid var(--linea); border-radius:6px; padding:1.25rem; margin-bottom:1.25rem; }
    label { display:block; font-weight:600; margin-bottom:.35rem; }
    input[type=text] { width:100%; max-width:360px; padding:.55rem .7rem; border:1px solid var(--linea); border-radius:4px; font-size:1rem; }
    button { background:var(--acento); color:#fff; border:0; border-radius:4px; padding:.65rem 1.2rem; font-size:1rem; cursor:pointer; }
    button:hover { background:#094a8c; }
    :focus-visible { outline:3px solid #f2b705; outline-offset:2px; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:.6rem .7rem; border-bottom:1px solid var(--linea); }
    th { background:#eef1f4; }
    td.num, th.num { text-align:right; }
    .msg { padding:.9rem 1rem; border-radius:4px; margin-bottom:1.25rem; border-left:5px solid; }
    .msg.ok { background:var(--ok-bg); border-color:var(--ok); }
    .msg.error { background:var(--err-bg); border-color:var(--err); color:var(--err); font-weight:600; }
    .codigo { font-size:1.5rem; font-weight:700; letter-spacing:.04em; }
    .suave { color:var(--suave); font-size:.92rem; }
    .opcion { display:flex; gap:.7rem; align-items:flex-start; padding:.65rem 0; border-bottom:1px solid var(--linea); }
    .opcion:last-of-type { border-bottom:0; }
    .opcion label { font-weight:400; margin:0; cursor:pointer; }
  </style>
</head>
<body>
  {% include 'navbar.html' %}
  <main>
    <h1>{% block encabezado %}{% endblock %}</h1>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
